name: Test1 SQL Keep Alive

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  playwright_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run Browser Script
        run: node keep_alive_ui.js
